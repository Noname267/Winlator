name: Android CI Bionic

on:
  push:
    branches: [ "winlator_bionic" ]
  pull_request:
    branches: [ "winlator_bionic" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
          submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleAntutuDebug assembleLudashiDebug

    - name: Upload AnTuTu APK
      uses: actions/upload-artifact@v4
      with:
        name: antutu-debug
        path: app/build/outputs/apk/antutu/debug/*.apk

    - name: Upload Ludashi APK
      uses: actions/upload-artifact@v4
      with:
        name: ludashi-debug
        path: app/build/outputs/apk/ludashi/debug/*.apk
